name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_build:
        description: "Run full tauri build even if packaging files weren't touched"
        type: boolean
        default: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packaging-changed: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            packaging:
              - 'src-tauri/tauri.conf.json'
              - 'src-tauri/Cargo.toml'
              - 'src-tauri/icons/**'

  lint-and-build:
    needs: detect-changes
    runs-on: windows-latest
    env:
      FULL_BUILD: ${{ github.event_name == 'push' || github.event.inputs.full_build == 'true' || needs.detect-changes.outputs.packaging-changed == 'true' }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Repo invariant check
        run: bun run check:repo

      - name: Lint check
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Type check
        run: bunx tsc --noEmit

      - name: Build frontend
        if: env.FULL_BUILD != 'true'
        run: bun run build

      - name: Cargo check
        if: env.FULL_BUILD != 'true'
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build Tauri app
        if: env.FULL_BUILD == 'true'
        run: bun run tauri build

      - name: Upload release artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-installers
          path: src-tauri/target/release/bundle
          retention-days: 7
