[package]
name = "paste-smart"
version = "0.1.6"
description = "Smart Paste — clipboard history overlay with AI-assisted selection"
authors = ["theprinceraj"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "paste_smart_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-clipboard-manager = "2"
# Jev API calls go through Rust: the API rejects browser origins (CORS), and a
# client we own keeps its connection pool alive between pastes. The user's own
# API key is read from a local config file (see src/api.rs) and attached here.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "http2",
] }
tokio = { version = "1", default-features = false, features = ["time"] }

# Desktop-only: global hotkey, active window lookup and synthetic keystrokes.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
active-win-pos-rs = "0.11"
enigo = "0.3"

# Debug builds are for iterating, not debugging dependencies: full symbols for
# ~465 crates cost several gigabytes. Line tables keep backtraces readable.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
